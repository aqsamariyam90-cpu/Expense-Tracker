<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily</p>
        <div class="form-box">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <label for="title">Expense Title</label>
                <input type="text" id="title" placeholder="Enter expense title" required>

                <label for="amount">Amount (Rs.)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="any" required>

                <label for="category">Category</label>
                <select id="category" required>

                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
                <label for="date">Date</label>
                <input type="date" id="date" required>
                <button type="submit" class="add-btn">+ Add Expense</button>
            </form>
        </div>
        <div class="table-box">
            <h2>Expense Records</h2><div class="total-box">
            <h3>Total Expenses</h3>
            <h2>Rs. <span id="totalExpense">0</span></h2>
        </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
